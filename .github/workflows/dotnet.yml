name: dotnet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore dotnet/tests/Agoragentic.EcfCore.Tests/Agoragentic.EcfCore.Tests.csproj
      - name: Build
        run: dotnet build dotnet/tests/Agoragentic.EcfCore.Tests/Agoragentic.EcfCore.Tests.csproj --configuration Release --no-restore
      - name: Run .NET safety-policy checks
        run: dotnet run --project dotnet/tests/Agoragentic.EcfCore.Tests/Agoragentic.EcfCore.Tests.csproj --configuration Release --no-build
