name: Publish ECF Core to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm trusted publishing runtime
        run: |
          node --version
          npm --version

      - name: Verify exact release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Expected release tag ${expected}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Install locked package metadata
        run: npm ci

      - name: Run release gate
        run: npm run release:dry

      - name: Publish ECF Core with npm trusted publishing
        run: npm publish --access public --provenance
