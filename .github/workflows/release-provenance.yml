name: release-provenance

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Verify exact release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - run: npm run release:dry
      - run: npm pack
      - name: Write SHA-256 checksums
        run: sha256sum agoragentic-ecf-core-*.tgz > SHA256SUMS.txt
      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            agoragentic-ecf-core-*.tgz
            SHA256SUMS.txt
      - name: Upload release artifacts
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" agoragentic-ecf-core-*.tgz SHA256SUMS.txt --clobber
