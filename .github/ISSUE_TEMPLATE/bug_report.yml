name: Bug report
description: Report a reproducible ECF Core issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, fixture shape, and expected output.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary check
      description: Confirm no secrets, customer data, or private Full ECF internals are included.
    validations:
      required: true
