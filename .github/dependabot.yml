version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directories:
      - "/dotnet/src/**"
      - "/dotnet/tests/**"
      - "/dotnet/examples/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
